name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
      - name: Minimal native build for core library
        run: |
          cmake -S ros2_ws/src/drone_system_core -B /tmp/core-build || true
      - uses: github/codeql-action/analyze@v4
