name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure ROS 2 apt repository
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release software-properties-common
          sudo add-apt-repository universe -y
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
          sudo apt-get update
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get install -y ros-jazzy-ros-base ros-jazzy-ros-gz qtbase5-dev libcurl4-openssl-dev nlohmann-json3-dev python3-colcon-common-extensions python3-rosdep
          sudo rosdep init 2>/dev/null || true
          rosdep update
          cd ros2_ws
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
