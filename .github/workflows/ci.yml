name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-noble-ros-jazzy-ros-base
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y ros-jazzy-ros-gz qtbase5-dev libcurl4-openssl-dev nlohmann-json3-dev python3-colcon-common-extensions python3-rosdep
          rosdep update
          cd ros2_ws
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
